name: Type label

on:
  pull_request:
    types: [opened, reopened, synchronize, labeled, unlabeled, edited, ready_for_review]
  issues:
    types: [opened, reopened, edited, labeled, unlabeled]

permissions:
  contents: read

jobs:
  type-label:
    name: Type label
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Require exactly one type label on a pull request
        if: github.event_name == 'pull_request'
        env:
          LABELS_JSON: ${{ toJson(github.event.pull_request.labels) }}
        run: python .github/scripts/check_type_label.py

      - name: Require exactly one type label on an issue
        if: github.event_name == 'issues'
        env:
          LABELS_JSON: ${{ toJson(github.event.issue.labels) }}
        run: python .github/scripts/check_type_label.py
